name: Windows WebUI package

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "webui/**"
      - "deploy/windows-webui/**"
      - "ui/**"
      - ".github/workflows/webui-windows-build.yml"

permissions:
  contents: read

jobs:
  package:
    name: Portable Windows WebUI
    runs-on: windows-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}\.ci\.rustup
      CARGO_HOME: ${{ github.workspace }}\.ci\.cargo
      npm_config_prefix: ${{ github.workspace }}\.ci\npm-global
      npm_config_cache: ${{ github.workspace }}\.ci\npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Release runs must build the published tag; PR/manual runs keep their
          # event ref (the same ref actions/checkout would select by default).
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Assert published release checkout
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $releaseTag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw "release event did not provide github.event.release.tag_name"
          }
          $headCommit = ((git rev-parse --verify HEAD 2>$null) -join '').Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($headCommit)) {
            throw "unable to resolve the checked-out commit"
          }
          $tagRef = "refs/tags/$releaseTag"
          $tagCommit = ((git rev-parse --verify "$tagRef^{commit}" 2>$null) -join '').Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "release tag '$releaseTag' is not present in the checkout"
          }
          Write-Host "release_tag=$releaseTag"
          Write-Host "release_tag_commit=$tagCommit"
          Write-Host "release_checkout_commit=$headCommit"
          Write-Host "release_source_ref=$releaseTag@$headCommit"
          if ($headCommit -ne $tagCommit) {
            throw "checkout commit $headCommit does not match release tag '$releaseTag' ($tagCommit)"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install browser smoke dependency
        working-directory: ui
        run: npm ci

      - name: Generate and validate release SBOM
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $sbomDir = Join-Path $env:RUNNER_TEMP "airp-release-sbom"
          New-Item -ItemType Directory -Force $sbomDir | Out-Null
          node tools/dep-governance/discover-deps.mjs `
            --repo-root . `
            --out-dir $sbomDir `
            --config tools/dep-governance/audit-routing.config.json `
            --fail-on-block
          if ($LASTEXITCODE -ne 0) { throw "dependency discovery blocked the release" }
          node tools/dep-governance/generate-sbom.mjs `
            --inventory (Join-Path $sbomDir "inventory.json") `
            --out-dir $sbomDir `
            --config tools/dep-governance/audit-routing.config.json `
            --fail-on-unknown
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation blocked the release" }
          foreach ($file in @("airp.spdx.json", "airp.cdx.json", "THIRD-PARTY-NOTICES.txt")) {
            if (-not (Test-Path (Join-Path $sbomDir $file))) {
              throw "release SBOM output missing: $file"
            }
          }

      - name: Upload release SBOM bundle
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: airp-release-sbom
          if-no-files-found: error
          path: ${{ runner.temp }}/airp-release-sbom

      - name: Build portable WebUI package
        shell: pwsh
        run: .\deploy\windows-webui\build.ps1 -IncludeDesktop

      - name: Smoke packaged engine and real Chrome
        shell: pwsh
        run: .\deploy\windows-webui\smoke-package.ps1 -BrowserSmoke

      - name: Smoke desktop UI inside the package
        shell: pwsh
        run: .\deploy\windows-webui\smoke-desktop-ui.ps1

      - name: Upload portable WebUI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: airp-webui-windows-x64
          if-no-files-found: error
          path: dist/airp-webui-windows-x64.zip

  publish-release:
    name: Attach portable WebUI to release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airp-webui-windows-x64
          path: release

      - name: Download verified release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airp-release-sbom
          path: release/sbom

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/airp-webui-windows-x64.zip release/sbom/* --clobber
