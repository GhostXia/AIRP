name: Agent Browser Exploration

# 阶段 2: 重大功能 PR 自动运行。Non-blocking (continue-on-error at job level).
# 触发条件: PR opened/synchronized/reopened, 且 diff 命中 Edit/Branch/Swipe/Memory/onboarding 任一区域。
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'engine/src/daemon/handlers/chat.rs'
      - 'engine/src/daemon/handlers/memory.rs'
      - 'engine/src/chat_store.rs'
      - 'engine/src/memory/**'
      - 'webui/assets/onboarding.js'
      - 'webui/assets/chat-space.js'
      - 'webui/screens/16-onboarding.html'
      - 'webui/screens/02-chat-space.html'
      - 'webui/screens/14-message-swipe.html'
      - 'webui/screens/17-memory-state.html'
      - 'webui/screens/19-branch-tree.html'
      # 修复自身触发：改 workflow / runner / bootstrap 也应触发验证
      - '.github/workflows/agent-browser-exploration.yml'
      - 'tools/agent-exploration/**'
      - 'deploy/production/bootstrap-topology.sh'

permissions:
  contents: read
  pull-requests: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # MVP: non-blocking
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # B9 方案 3：不再做 LLM key 预检 + skip 整 job。
      # OPENAI_API_KEY 未配时，runner.mjs + llm-client.mjs 自动进入 fallback 模式：
      # 跑内置 minimal smoke 脚本（只 navigate + snapshot，不做业务断言），
      # 验证 topology + harness + runner + reporter + commenter 全链路可达。
      # secret 已配时走真 LLM 路径。两种模式都跑同一个 workflow，省一份配置。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install runner deps
        working-directory: tools/agent-exploration
        run: npm install

      # B6 修复：bootstrap-topology.sh 内部 `docker run airp-gateway:0.1.0 hash-password`
      # 要求本地已 build 该镜像。pr-gate.yml 调用 smoke-ci.sh 前会先跑
      # `docker compose build --pull`，本 workflow 也必须先 build 镜像，否则
      # `docker run` 会因镜像不存在去 pull，触发 pull access denied (exit 125)。
      # build 需要 .env 存在 (compose.yaml 引用 $AIRP_VERSION 等)，但 bootstrap-topology.sh
      # 内部生成 .env 是在 docker run 之后，存在 chicken-and-egg。所以先用 .env.example
      # 临时 .env 让 build 通过；bootstrap-topology.sh 会再覆盖 .env 用于实际 topology。
      - name: Prepare .env for image build
        working-directory: deploy/production
        run: cp .env.example .env

      - name: Build pinned production images
        working-directory: deploy/production
        run: docker compose --env-file .env -f compose.yaml build --pull

      - name: Bootstrap production smoke topology
        working-directory: deploy/production
        run: |
          # 用 bootstrap-topology.sh 只启 mock provider + TLS + 临时数据拓扑,
          # 不跑 smoke-ci.sh 自身（避免重复跑现有 smoke）
          # 脚本会启 docker compose 后台拓扑, 等待 health ready 后返回, 不阻塞
          ./bootstrap-topology.sh
          echo "TOPOLOGY_BOOTSTRAPPED=1" >> $GITHUB_ENV

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 单独 step 取 PR diff 到文件, runner 不需要 GITHUB_TOKEN (减少 secret 暴露面)
          mkdir -p artifacts/agent-exploration
          gh api repos/GhostXia/AIRP/pulls/${{ github.event.pull_request.number }} \
            -H "Accept: application/vnd.github.v3.diff" \
            > artifacts/agent-exploration/pr-diff.patch

      - name: Select infrastructure smoke mode
        working-directory: tools/agent-exploration
        run: |
          # Empty classification is normally a failure. The only exception is
          # a workflow/runner/bootstrap-only PR, which gets the fixed builtin
          # topology smoke (never an LLM-generated or business task).
          node --input-type=module - <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          import { classifyPrDiff, isInfrastructureSmokeDiff } from './classifier.mjs';

          const diff = await readFile('../../artifacts/agent-exploration/pr-diff.patch', 'utf8');
          const tasks = classifyPrDiff(diff);
          if (tasks.length === 0 && isInfrastructureSmokeDiff(diff)) {
            await appendFile(process.env.GITHUB_ENV, 'AIRP_INFRASTRUCTURE_SMOKE=1\n');
            console.log('infrastructure-smoke enabled for allowlisted empty classification');
          } else {
            console.log('infrastructure-smoke disabled; runner will enforce normal classification semantics');
          }
          NODE

      - name: Run agent exploration
        env:
          AIRP_SMOKE_ORIGIN: https://localhost:9443
          AIRP_SMOKE_ADMIN_USER: airp-smoke
          AIRP_SMOKE_ADMIN_PASSWORD: synthetic-smoke-password
          AIRP_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          AIRP_AUTH_USER: airp-smoke
          AIRP_AUTH_PASSWORD: synthetic-smoke-password
          # TLS 修复：bootstrap-topology.sh 已把 chrome_spki 写到 $GITHUB_ENV。
          # runner.mjs 据此构造 --ignore-certificate-errors-spki-list=<spki> 参数，
          # 让 Chrome 精确信任 gateway 自签证书的 SPKI，而非无脑 ignoreHTTPSErrors。
          # 对齐 pr-gate.yml 的 production-browser-smoke.mjs 模式。
          AIRP_CHROME_SPKI: ${{ env.AIRP_CHROME_SPKI }}
          # B9 方案 3：未配 secret 时 GitHub 传空串, runner 自动进 fallback 模式
          # (跑内置 smoke 脚本验证管线); 已配时走真 LLM 路径
          OPENAI_API_KEY: ${{ secrets.AGENT_EXPLORATION_OPENAI_KEY }}
          OPENAI_MODEL: ${{ secrets.AGENT_EXPLORATION_MODEL || 'gpt-4o-mini' }}
          # 自定义 endpoint：支持 Azure OpenAI、代理或其他 OpenAI 兼容服务
          # 未配时默认 https://api.openai.com/v1（见 llm-client.mjs）
          OPENAI_BASE_URL: ${{ secrets.AGENT_EXPLORATION_BASE_URL }}
          # 故意不传 GITHUB_TOKEN: runner 不需要它 (diff 已在上一步取到文件),
          # 避免生成的临时脚本 exfiltrate repo write token。PR 评论用单独 step 的 GH_TOKEN。
        working-directory: tools/agent-exploration
        run: |
          npm test
          # 防回归：先跑 TLS 契约测试，确认 runner.mjs/tls-args.mjs/workflow/bootstrap
          # 四处的 SPKI 处理逻辑都存在且互相一致。这一步独立于 runner 本身，
          # 即使 runner 因 LLM/网络失败，TLS 契约仍能验证修复未退化。
          node --test runner-tls.test.mjs
          # 防回归：跑脚本预检测试。它会在执行前验证 ES module 语法、
          # `export async function run(ctx)` 合同和已知反模式。
          node --test script-lint.test.mjs script-validation.test.mjs
          # 再跑 runner 本身
          runner_args=( \
            --origin $AIRP_SMOKE_ORIGIN \
            --pr ${{ github.event.pull_request.number }} \
            --diff-file ../../artifacts/agent-exploration/pr-diff.patch \
            --report-dir ../../artifacts/agent-exploration \
            --chrome-path $AIRP_CHROME_PATH \
          )
          if [ "${AIRP_INFRASTRUCTURE_SMOKE:-}" = "1" ]; then
            runner_args+=(--mode infrastructure-smoke)
          fi
          node runner.mjs "${runner_args[@]}"

      - name: Teardown topology
        if: always()
        working-directory: deploy/production
        run: |
          # 用同一脚本 teardown, 保证 mock provider + 临时数据卷在 job 结束前清理
          ./bootstrap-topology.sh --teardown

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-exploration-${{ github.event.pull_request.number }}
          # 包含 deploy/production/*.log 用于 bootstrap 失败诊断（B7）：
          # topology-bootstrap.log, mock-provider.log 等
          path: |
            artifacts/agent-exploration/
            deploy/production/*.log
          retention-days: 14

      # B2 修复：runner 失败时 exit 1（虽然 job continue-on-error: true 不阻塞合并，
      # 但 step failure 会触发本步骤），先发占位评论确保失败信号不会因下游
      # Publish PR comment 自身失败（report.md 未生成 / gh 不可用）而完全丢失。
      - name: Publish failure placeholder comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 用 --body-file - 通过 stdin 传 body，避免引号转义 / 长度限制
          gh pr comment "$PR_NUMBER" --body-file - <<'EOF'
          ## ⚠️ Agent exploration runner failed

          The exploration runner exited with a non-zero status. The actual report comment may be missing or partial.

          - See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs.
          - Download the `agent-exploration-${{ github.event.pull_request.number }}` artifact for any partial report/trace files.

          This is a non-blocking placeholder (workflow has `continue-on-error: true`); merge is not blocked. Investigate the failure if it persists.
          EOF

      - name: Publish PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node tools/agent-exploration/post-pr-comment.mjs artifacts/agent-exploration/report.md
