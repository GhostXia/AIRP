<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧情时间线导出 · AIRP 控制台</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/components.css"><link rel="stylesheet" href="../assets/console.css"><link rel="stylesheet" href="../assets/timeline-export.css">
</head>
<body data-screen="timelineexport">
<div class="canvas">
<header class="topbar"><div class="topbar-left"><span class="logo-block">A</span><span class="product-name">AIRP 控制台</span><span class="topbar-divider"></span><span class="crumb" id="page-title">剧情时间线导出</span></div><div class="topbar-right"><span class="status-pill" id="engine-status" role="status"><i class="dot"></i>正在连接</span></div></header>
<div class="console-body">
<nav class="console-nav" id="console-nav"></nav>
<main class="console-main">
<div class="scope-bar"><span>角色 <b id="scope-character">—</b></span><span>用户 <b id="scope-user">—</b></span><span class="engine-addr" id="engine-address"></span></div>
<h1 class="heading" id="heading-title">剧情时间线导出</h1>
<p class="description">从 chat history 与 world_events 整合生成结构化时间线，支持 <b>JSON / Markdown / HTML</b> 三种格式导出。HTML 可通过浏览器"打印为 PDF"获取 PDF。</p>
<div id="runtime-status" class="runtime-status"></div>
<div id="view">
  <div class="runtime-form">
    <label class="field"><span class="field-label">角色</span><select class="select runtime-select" id="tl-character"></select></label>
    <label class="field"><span class="field-label">会话</span><select class="select runtime-select" id="tl-session"></select></label>
    <button class="btn btn-primary" id="tl-load" type="button">加载时间线</button>
  </div>
  <div class="tl-meta" id="tl-meta" hidden>
    <h2 class="subheading">元数据</h2>
    <dl id="tl-meta-list" class="meta-list"></dl>
  </div>
  <div class="tl-stats" id="tl-stats" hidden>
    <span class="stat-pill">消息 <b id="tl-stat-messages">0</b></span>
    <span class="stat-pill">已触发事件 <b id="tl-stat-triggered">0</b></span>
    <span class="stat-pill">条目 <b id="tl-stat-entries">0</b></span>
  </div>
  <div class="tl-actions" id="tl-actions" hidden>
    <button class="btn btn-secondary" id="tl-export-json" type="button">下载 JSON</button>
    <button class="btn btn-secondary" id="tl-export-md" type="button">下载 Markdown</button>
    <button class="btn btn-secondary" id="tl-export-html" type="button">下载 HTML</button>
    <button class="btn btn-secondary" id="tl-preview-md" type="button">预览 Markdown</button>
    <button class="btn btn-secondary" id="tl-preview-html" type="button">预览 HTML</button>
  </div>
  <div class="tl-entries" id="tl-entries" hidden>
    <h2 class="subheading">时间线条目</h2>
    <ol id="tl-entry-list" class="tl-list"></ol>
  </div>
  <div class="tl-pending" id="tl-pending" hidden>
    <h2 class="subheading">附录：未触发世界事件</h2>
    <ul id="tl-pending-list" class="tl-pending-list"></ul>
  </div>
  <div class="tl-preview" id="tl-preview" hidden>
    <h2 class="subheading" id="tl-preview-title">预览</h2>
    <div class="tl-preview-controls">
      <button class="btn btn-secondary" id="tl-preview-close" type="button">关闭预览</button>
    </div>
    <pre id="tl-preview-md-content" class="result-content" hidden></pre>
    <iframe id="tl-preview-html-frame" class="tl-preview-frame" hidden title="HTML 预览" sandbox="allow-same-origin"></iframe>
  </div>
</div>
<div class="related-links" id="related-links"></div>
</main>
</div></div>
<script src="../assets/api-client.js"></script>
<script src="../assets/desktop-session.js"></script><script src="../assets/timeline-export.js"></script>
</body></html>
