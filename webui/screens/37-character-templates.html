<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色卡模板库 · AIRP 控制台</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/components.css"><link rel="stylesheet" href="../assets/console.css"><link rel="stylesheet" href="../assets/character-templates.css">
</head>
<body data-screen="templates">
<div class="canvas">
<header class="topbar"><div class="topbar-left"><span class="logo-block">A</span><span class="product-name">AIRP 控制台</span><span class="topbar-divider"></span><span class="crumb" id="page-title">角色卡模板库</span></div><div class="topbar-right"><span class="status-pill" id="engine-status" role="status"><i class="dot"></i>正在连接</span></div></header>
<div class="console-body">
<nav class="console-nav" id="console-nav"></nav>
<main class="console-main">
<div class="scope-bar"><span>角色 <b id="scope-character">—</b></span><span>会话 <b id="scope-session">—</b></span><span>用户 <b id="scope-user">—</b></span><span class="engine-addr" id="engine-address"></span></div>
<h1 class="heading" id="heading-title">角色卡模板库</h1>
<div id="runtime-status" class="runtime-status"></div>
<div id="view">
  <p class="hint">从内建模板起步，导入后可任意修改。模板由 AIRP 独立编写，非第三方角色卡复制。</p>
  <div class="template-filter">
    <label class="field"><span class="field-label">分类</span><select class="select" id="template-category-filter"><option value="">全部</option></select></label>
    <input class="input" id="template-search" type="search" placeholder="搜索名称或描述">
  </div>
  <div id="template-grid" class="template-grid">加载中…</div>
  <div id="template-detail" class="template-detail" hidden>
    <h2 class="subheading" id="detail-title">模板详情</h2>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-actions">
      <label class="field"><span class="field-label">新角色 ID（可选，留空自动派生）</span><input class="input" id="detail-char-id" placeholder="如：my-knight"></label>
      <label class="field"><span class="field-label">新角色名（可选，留空用模板名）</span><input class="input" id="detail-name-override" placeholder="如：流浪的兰斯"></label>
      <button class="btn btn-primary" id="detail-instantiate" type="button">从此模板创建角色</button>
      <button class="btn btn-secondary" id="detail-close" type="button">关闭</button>
    </div>
  </div>
</div>
<div class="related-links" id="related-links"></div>
</main>
</div></div>
<script src="../assets/api-client.js"></script><script src="../assets/character-templates.js"></script>
</body></html>
