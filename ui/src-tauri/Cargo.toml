[package]
name = "airp-ui"
version.workspace = true
rust-version = "1.89"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AIRP UI desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Dev-mode 兜底钩子（build.rs）：读锁文件杀残留 engine，避免残留进程
# 锁住 target/ 下的 sidecar 拷贝导致构建 PermissionDenied。
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
# C-P0：内容面换为 engine 同源 webui；bus.rs intent relay 与 State Protocol
# 桥归档到 docs/archive/2026-08-04-c-p0-desktop-shell/（airp-state-protocol /
# futures-util 依赖随之移除；协议线型仍由 protocol crate 权威持有）。

[[bin]]
name = "airp-ui"
path = "src/main.rs"
